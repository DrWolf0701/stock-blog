<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日美股新聞彙整 - {{日期}}</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 20px;
            background: #f5f7fa;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
        }
        
        .header .date {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .header .subtitle {
            font-size: 1.1rem;
            margin-top: 10px;
            opacity: 0.8;
        }
        
        .content {
            padding: 30px;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 1.5rem;
            color: #667eea;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        
        .news-item {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid #eee;
        }
        
        .news-item:last-child {
            border-bottom: none;
        }
        
        .news-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .news-summary {
            color: #666;
            line-height: 1.6;
        }
        
        .news-source {
            color: #888;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        
        .market-summary {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin: 30px 0;
            border-radius: 0 5px 5px 0;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #888;
            font-size: 0.9rem;
            border-top: 1px solid #eee;
            margin-top: 30px;
        }
        
        .footer-note {
            font-style: italic;
            margin-top: 10px;
            color: #666;
        }
        
        /* 隱藏收件人資訊的樣式 */
        .recipient-info {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📈 每日美股新聞彙整</h1>
            <div class="date">{{日期}}</div>
            <div class="subtitle">專業市場分析與重點新聞摘要</div>
        </div>
        
        <div class="content">
            <div class="market-summary">
                <h2>📊 市場概覽</h2>
                <p>{{市場概覽}}</p>
            </div>
            
            <div class="section">
                <h2 class="section-title">📰 重點新聞</h2>
                {{新聞項目}}
            </div>
            
            <div class="section">
                <h2 class="section-title">💡 投資建議</h2>
                <p>{{投資建議}}</p>
            </div>
            
            <!-- 收件人資訊區塊（隱藏） -->
            <div class="recipient-info">
                <h2>📧 發送資訊</h2>
                <p>此報告已透過密件副本（BCC）發送給指定收件人。</p>
            </div>
        </div>
        
        <div class="footer">
            <p>本報告僅供參考，不構成投資建議。投資有風險，請謹慎評估。</p>
            <div class="footer-note">報告生成時間：{{生成時間}} | 資料來源：公開市場資訊</div>
        </div>
    </div>
</body>
</html>
